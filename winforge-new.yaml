# yaml-language-server: $schema=./refactor/winforge.schema.json
# Migrated from winforge.yaml into schema v1 vocabulary.
# Secrets use *Ref names — resolve via your secret provider before deploy.
# Delete any section you do not want WinForge to manage. Omitted = unmanaged.

schemaVersion: 1

system:
  hostname: WINFORGE-PC
  locale: en-US
  timeZone: E. Australia Standard Time   # Was "AU"; use a real Windows time-zone ID
  deviceSetupPrompts: hide
  languages:
    add: [en-US, en-GB]

activation:
  edition: pro
  productKeyRef: windowsProductKey

apps:
  provider: chocolatey
  storeAccess: block                     # Former DisableWindowsStore
  oneDrive: block                        # Usage policy; does not uninstall OneDrive
  removeProfiles: [legacyBloatwareV1]    # Former RemoveBloatware
  add:
    - id: 7zip
      version: '19.00'
    - id: firefox
      version: '119.0.1'
    - id: vscode                        # Omitted version: install/upgrade to latest
    - id: nodejs
      version: '20.9.0'
  remove:
    - id: 7zip
    - id: firefox

environment:
  add:
    - name: PythonPath
      scope: user
      value: 'C:\Python312'
    - name: NodePath
      scope: user
      value: 'C:\Program Files\nodejs'
    - name: CompanyName
      scope: machine
      value: "Cyberdyne Systems"
    - name: Department
      scope: machine
      value: "Machine Research"
      
explorer:
  fileExtensions: show
  hiddenItems: show
  contextMenu: classic                   # Former Tweaks.ClassicRightClickMenu
  allTasksFolder: add                    # Former Tweaks.GodModeFolder

taskbar:
  alignment: left                        # left | centre
  meetNow: hide
  widgets: hide
  taskView: hide
  search: hide

startMenu:                               # Split out of Privacy in the new schema
  appLaunchTracking: disable
  recentlyAddedApps: hide
  suggestions: hide

theme:
  mode: dark
  desktopIconSize: medium                # small | medium | large
  wallpaper: 'https://images.pexels.com/photos/2085998/pexels-photo-2085998.jpeg'
  lockScreen: 'https://images.pexels.com/photos/2341830/pexels-photo-2341830.jpeg'
  transparency: disable                  # Merges DisableTransparency + DisableTransparencyEffects
  animations: disable

power:
  plan: balanced
  sleep: enable
  hibernate: enable
  fastStartup: disable
  displayTimeout: 15m
  sleepTimeout: 30m
  hibernateTimeout: 1h

network:
  discovery: enable
  fileAndPrinterSharing: enable
  drives:
    add:
      - letter: S
        path: '\\192.168.0.10\Media'
        username: Administrator
        passwordRef: networkSharePasswordS
      - letter: T
        path: '\\192.168.0.10\Media'
        username: Administrator
        passwordRef: networkSharePasswordT

privacy:
  diagnosticData: disable                # Former DisableTelemetry / DisableDiagnosticData
  diagnosticTracking: disable
  location: block                        # Former DisableAppPrivacy (split)
  microphone: block
  camera: block
  personalisedAdvertising: block
  activityHistory: disable
  clipboardHistory: disable
  recall: disable
  copilot: disable                       # Was under System; lives with privacy now

fonts:
  add: [roboto, opensans, lato, firasans]

googleDrive:
  install: add
  browserPath: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  onboardingDialog: hide
  photosSync: disable
  startAtLogin: enable
  officeFiles: googleDocs                # googleDocs | desktopApp

googleChrome:
  install: add
  enrolmentTokenRef: chromeEnrolmentToken
  pdfHandling: external                  # browser | external
  signIn: required                       # disable | optional | required

googleGcpw:
  install: add
  enrolmentTokenRef: gcpwEnrolmentToken
  allowedDomains: [example.com]

security:
  autoPlay: disable
  remoteDesktop: disable                 # Was under System
  uac:
    state: enable
    prompt: notifyChanges                # alwaysNotify | notifyChanges | notifyWithoutDimming | neverNotify

defender:
  realTimeProtection: enable
  cloudProtection: advanced              # disable | basic | advanced
  sampleSubmission: never                # AutomaticSampleSubmission was false
  networkProtection: block               # disable | audit | block
  controlledFolderAccess: disable
  attackSurfaceReduction: enable
  exclusions:
    paths:
      add: ['C:\MyApp\', 'C:\Temp\']
    extensions:
      add: ['.tmp', '.log']
    processes:
      add: [myapp.exe, backup.exe]
  scans:
    quickTime: '02:00'
    fullDay: sunday
    removableDrives: enable
    archives: enable
    networkFiles: disable
  defaultThreatAction: quarantine        # clean | quarantine | remove | allow | userDefined | block

updates:
  # AUOptions 3 maps to downloadAndNotify. Day/time only apply with scheduledInstall.
  mode: downloadAndNotify                # disable | notifyBeforeDownload | downloadAndNotify | scheduledInstall
  minorUpdates: automatic                # automatic | manual

features:
  enable:
    - Microsoft-Hyper-V-All
    - Microsoft-RemoteDesktopConnection
    - VirtualMachinePlatform
  disable:
    - Containers-DisposableClientVM      # Was both enabled and disabled; disable wins

office:
  productId: ProPlus2019Retail
  productKeyRef: officeProductKey
  languages: [en-US]
  channel: SemiAnnual
  architecture: x64                      # x86 | x64
  installerUi: hide                      # show | hide
  restart: never                         # never | ifRequired | always
  updates: enable

registry:
  add:
    - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      name: DisableLockScreenAppNotifications
      type: dword
      value: 1
      description: Disable lock screen app notifications
    - path: 'HKLM:\SOFTWARE\Google\DriveFS'
      name: DefaultWebBrowser
      type: string
      value: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
      description: Set default web browser for Google Drive
    - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      name: DisableTaskMgr
      type: dword
      value: 1
  remove:
    - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      name: DisableLockScreenAppNotifications
    - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      name: DisableTaskMgr

tasks:
  add:
    - name: AutoShutdown
      folder: '\WinForge\'
      source: 'https://raw.githubusercontent.com/Graphixa/WinforgeX/main/Tasks/AutoShutdown.xml'
      description: Auto Shutdown
      state: enable
    - name: Task2
      folder: '\WinForge\'
      source: 'C:\Tasks\Task2.xml'
      description: Task 2
      state: enable
    - name: Task3
      folder: '\WinForge\'
      source: 'C:\Tasks\Task3.xml'
      description: Task 3
      state: enable
  remove:
    - name: Task2
      folder: '\WinForge\'
    - name: Task3
      folder: '\WinForge\'
  # Former AddRepository — pin an immutable commit before use:
  # repositories:
  #   - url: 'https://github.com/Graphixa/Winforge.git'
  #     revision: '<40-hex commit SHA>'
  #     path: Tasks

files:
  add:
    - path: '%USERPROFILE%\Documents\file.txt'
      type: file
      source: '\\server\share\file.txt'
    - path: 'C:\Reports\data.csv'
      type: file
      source: '\\server\share\data.csv'
    - path: 'C:\ProgramData\App\configs'
      type: directory
      source: '\\server\share\configs'
    - path: 'C:\Temp\newfile.txt'
      type: file
    - path: 'C:\Temp\newfolder'
      type: directory
  remove:
    - path: 'C:\Temp\oldfolder'
      type: directory
    - path: 'C:\Temp\oldfile.txt'
      type: file
    - path: 'C:\Users\Public\Logs'
      type: directory
  move:
    - source: 'C:\Temp\file.txt'
      destination: 'D:\Temp\file.txt'
      type: file
    - source: 'C:\Temp\folder'
      destination: 'D:\Backup\folder'
      type: directory
  rename:
    - path: 'C:\Temp\oldname.txt'
      newName: newname.txt
      type: file
    - path: 'C:\Temp\oldfolder'
      newName: newfolder
      type: directory

shortcuts:
  add:
    - name: Google Chrome
      location: desktop
      target: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
      arguments: ['--profile-directory=Default']
      icon:
        path: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        index: 0
      workingDirectory: 'C:\Program Files\Google\Chrome\Application'
    - name: Notepad
      location: startMenu
      target: notepad.exe
      icon:
        path: notepad.exe
        index: 0

commands:
  # Each command needs a stable id and a read-only test (0 = already ok, 1 = apply).
  - id: create-temp-hello-file
    shell: powershell
    script: |
      New-Item -Path 'C:\Temp\test.txt' -ItemType File -Value 'Hello, World!' -Force | Out-Null
    test:
      shell: powershell
      script: |
        $p = 'C:\Temp\test.txt'
        if ((Test-Path -LiteralPath $p -PathType Leaf) -and ((Get-Content -LiteralPath $p -Raw) -eq 'Hello, World!')) { exit 0 }
        exit 1
  - id: echo-hello-cmd
    shell: cmd
    script: 'echo Hello, World!'
    test:
      shell: cmd
      script: 'exit /b 1'               # Always apply; demo command with no durable state
